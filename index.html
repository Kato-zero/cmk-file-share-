<style>
:root{--blue:#007aff;--red:#ff3b30;--green:#34c759;--bg:#f2f2f7;--card:#fff;--label:#000;--label2:rgba(60,60,67,.6);--sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);--blur:rgba(249,249,249,.82);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--blue:#0a84ff;--red:#ff453a;--green:#30d158;--bg:#000;--card:#1c1c1e;--label:#fff;--label2:rgba(235,235,245,.6);--sep:rgba(84,84,88,.5);--fill:rgba(118,118,128,.24);--blur:rgba(22,22,24,.82)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
#phone{position:relative;height:100dvh;width:100%;overflow:hidden;background:var(--bg)}
@media(min-width:600px){body{background:#d1d1d6;display:flex;align-items:center;justify-content:center}
#phone{width:390px;height:min(844px,calc(100dvh - 40px));border-radius:48px;box-shadow:0 0 0 10px #111,0 30px 80px rgba(0,0,0,.35);--sat:44px;--sab:20px}}

/* Auth */
#auth{position:absolute;inset:0;overflow-y:auto;padding:calc(var(--sat) + 48px) 20px calc(var(--sab) + 24px);background:var(--bg);z-index:30}
.app-icon{width:76px;height:76px;border-radius:18px;background:linear-gradient(160deg,#4da3ff,#0a64d6);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 8px 22px rgba(0,122,255,.35)}
.app-icon svg{width:40px;height:40px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#auth h1{text-align:center;font-size:30px;margin:0 0 6px;letter-spacing:-.4px}
#auth .sub{text-align:center;color:var(--label2);margin:0 0 26px;font-size:15px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:18px}
.seg button{flex:1;padding:7px;border-radius:7px;font-size:13px;font-weight:600;transition:.2s}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.group input{display:block;width:100%;border:0;background:none;padding:14px 16px;font-size:17px;outline:none;border-bottom:.5px solid var(--sep)}
.group input:last-child{border-bottom:0}
.group input::placeholder{color:var(--label2)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:52px!important}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--label2);border-radius:8px;transition:color .15s,background .15s}
.pw-toggle:active{background:var(--fill);opacity:.9}
.pw-toggle svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.pw-toggle.on{color:var(--blue)}
@media(prefers-color-scheme:dark){
  .pw-toggle{color:rgba(235,235,245,.55)}
  .pw-toggle.on{color:var(--blue);filter:drop-shadow(0 0 6px rgba(10,132,255,.35))}
}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;margin-top:20px;transition:.15s}
.btn.ghost{background:var(--fill);color:var(--blue);margin-top:12px}
.btn:active{opacity:.6;transform:scale(.98)}.btn:disabled{opacity:.4}
.note{margin:14px 6px 0;padding:12px 14px;border-radius:12px;font-size:14px;display:none}
.note.show{display:block}.note.error{background:rgba(255,59,48,.14);color:var(--red)}.note.success{background:rgba(52,199,89,.16);color:var(--green)}

/* Nav */
#nav{position:absolute;top:0;left:0;right:0;z-index:10;padding-top:var(--sat);background:transparent;transition:.2s}
#nav.solid{background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--sep)}
.nav-row{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:relative}
.nav-title{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:17px;opacity:0;transition:.2s;pointer-events:none}
#nav.solid .nav-title{opacity:1}
.nav-btn{color:var(--blue);font-size:17px;padding:8px 0;z-index:1;display:flex;align-items:center;gap:4px}
.nav-btn:active{opacity:.4}.nav-btn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-l{display:flex;align-items:center;gap:14px;z-index:1}
#refreshBtn svg{width:22px;height:22px}
#refreshBtn.rotating svg{animation:rspin .6s linear}
@keyframes rspin{to{transform:rotate(360deg)}}

/* Scroll */
#scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 44px) 16px calc(var(--sab) + 110px)}
.large{font-size:34px;font-weight:700;letter-spacing:.3px;margin:2px 4px 10px}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 8px;height:36px;margin-bottom:18px}
.search svg{width:16px;height:16px;fill:none;stroke:var(--label2);stroke-width:2.2;stroke-linecap:round}
.search input{flex:1;border:0;background:none;outline:none;font-size:17px}
.search input::placeholder{color:var(--label2)}
.hdr{font-size:13px;color:var(--label2);margin:0 16px 7px;text-transform:uppercase;letter-spacing:-.1px}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left;position:relative;transition:background .1s}
.row:active{background:var(--fill)}
.row+.row::before{content:"";position:absolute;top:0;left:66px;right:0;height:.5px;background:var(--sep)}
.ico{flex:0 0 40px;height:40px;border-radius:9px;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:.2px}
.r-info{flex:1;min-width:0}
.r-name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-meta{font-size:13px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:8px;height:14px;stroke:var(--label2);opacity:.6;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 8px}
.empty{text-align:center;padding:70px 30px;color:var(--label2)}
.empty svg{width:64px;height:64px;fill:none;stroke:var(--label2);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.6;margin-bottom:10px}
.empty b{display:block;color:var(--label);font-size:21px;margin-bottom:4px}
.empty span{font-size:15px}
.foot{text-align:center;color:var(--label2);font-size:13px;margin-top:14px}
#scroll.drag{outline:3px dashed var(--blue);outline-offset:-8px}

/* Tab bar */
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;padding:7px 0 calc(var(--sab) + 2px);background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 -.5px 0 var(--sep)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--label2);font-size:10px;font-weight:500}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue)}.tab:active{opacity:.5}

/* Progress */
#progress{position:absolute;left:14px;right:14px;bottom:calc(var(--sab) + 70px);z-index:15;background:var(--blur);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-radius:18px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18);transition:.3s}
#progress.hidden{display:block!important;opacity:0;transform:translateY(20px);pointer-events:none}
.p-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.p-top span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:5px;border-radius:3px;background:var(--fill);margin:10px 0 7px;overflow:hidden}
.bar{height:100%;width:0;background:var(--blue);border-radius:3px;transition:width .15s linear}
.p-bot{display:flex;justify-content:space-between;font-size:12px;color:var(--label2)}
#progress.del .bar{background:var(--red)}
#progress.del .pcancel{display:none}
#progress.del #pPct{color:var(--red)!important}

/* Sheets */
.ov{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 8px calc(var(--sab) + 8px);animation:fade .25s}
.sheet{background:var(--blur);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;margin-bottom:8px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.sheet .t{padding:14px 16px;text-align:center;font-size:13px;color:var(--label2);border-bottom:.5px solid var(--sep)}
.sheet .t b{display:block;color:var(--label);font-size:15px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet button.a{display:block;width:100%;padding:17px;font-size:20px;color:var(--blue);border-top:.5px solid var(--sep)}
.sheet .t+button.a{border-top:0}
.sheet button.a:active{background:var(--fill)}
.sheet button.a.d{color:var(--red)}
.sheet.cancel button.a{font-weight:600;background:var(--card)}
.full{border-radius:22px;background:var(--bg);padding:18px 16px 20px;margin-bottom:0}
.full h3{margin:0 0 2px;text-align:center;font-size:17px}
.full p{margin:0 0 16px;text-align:center;font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full .btn{margin-top:14px}
.full .cancel-l{display:block;margin:14px auto 0;color:var(--blue);font-size:17px}
#toasts{position:absolute;top:calc(var(--sat) + 8px);left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:rgba(40,40,42,.92);color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:500;max-width:88%;text-align:center;animation:drop .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.error{background:rgba(255,59,48,.95)}.toast.success{background:rgba(40,160,80,.95)}
.row{cursor:pointer}
.ico{position:relative;overflow:hidden}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.more{flex:0 0 34px;height:34px;border-radius:50%;color:var(--blue);display:flex;align-items:center;justify-content:center}
.more:active{background:var(--fill)}.more svg{width:22px;height:22px;fill:currentColor}
.exp{color:#ff9500}
#pv{position:absolute;inset:0;z-index:60;background:#000;color:#fff;overflow:hidden;animation:fade .2s}
#pvStage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#pvStage img{max-width:100%;max-height:100%;object-fit:contain;touch-action:none;user-select:none;-webkit-user-drag:none}
#pvStage video{width:100%;max-height:100%;background:#000}
#pvStage iframe{width:100%;border:0;background:#fff;height:calc(100% - var(--sat) - var(--sab) - 100px);margin-top:calc(var(--sat) + 44px)}
.pv-top,.pv-bot{position:absolute;left:0;right:0;z-index:2;display:flex;align-items:center;transition:opacity .2s}
.pv-top{top:0;padding-top:var(--sat);height:calc(var(--sat) + 48px);background:linear-gradient(rgba(0,0,0,.65),transparent)}
.pv-bot{bottom:0;justify-content:center;gap:28px;padding:22px 0 calc(var(--sab) + 12px);background:linear-gradient(transparent,rgba(0,0,0,.65));font-size:14px}
.pv-top button,.pv-bot button{color:#fff;font-size:17px;min-width:64px;padding:8px 14px}
.pv-bot button{font-size:34px;line-height:1;min-width:44px;padding:0 10px}
.pv-top button:active,.pv-bot button:active{opacity:.4}
.pv-top svg{width:22px;height:22px;fill:#fff;vertical-align:middle}
#pvTitle{flex:1;text-align:center;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-hide .pv-top,.pv-hide .pv-bot{opacity:0;pointer-events:none}
.aud{display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px;text-align:center;width:100%}.aud audio{width:100%}
.big{width:110px;height:110px;font-size:24px;border-radius:24px;flex:none}
.nop{text-align:center;padding:30px}.nop .btn{max-width:220px;margin:18px auto 0}
.nav-r{display:flex;gap:14px;align-items:center;z-index:1}
.chk{display:none;flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--label2);align-items:center;justify-content:center;color:#fff;transition:.12s}
.selmode .chk{display:flex}.selmode .more{display:none}
.selmode .row+.row::before{left:100px}
.row.on .chk{background:var(--blue);border-color:var(--blue)}
.row.on .chk::after{content:"\2713";font-size:13px;font-weight:700}
#selbar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;padding:8px 22px calc(var(--sab) + 10px);min-height:calc(var(--sab) + 56px);background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 -.5px 0 var(--sep)}
#selbar button{color:var(--blue);font-size:17px;font-weight:500;padding:10px 4px}
#selbar button.dng{color:var(--red);margin-left:auto}
#selbar button:disabled{opacity:.35}#selbar button:active:not(:disabled){opacity:.5}
#selbar{gap:18px}
#selbar button#dlBtn{margin-right:auto}
.inst{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px;margin:0 0 16px}
.inst img{width:44px;height:44px;border-radius:10px;flex:none}
.inst div{flex:1;min-width:0;font-size:13px;color:var(--label2);line-height:1.3}
.inst b{display:block;color:var(--label);font-size:15px;margin-bottom:1px}
.pill{background:var(--blue);color:#fff;border-radius:16px;padding:6px 16px;font-weight:600;font-size:15px}
.pill:active{opacity:.6}
.inst .x{color:var(--label2);font-size:22px;line-height:1;padding:4px 4px 4px 2px}
.hdr{display:flex;justify-content:space-between;align-items:center}
#sortBtn{color:var(--blue);text-transform:none;font-size:13px;padding:2px 0}
.link{display:block;margin:16px auto 0;color:var(--blue);font-size:15px}
.loadmore{display:block;width:100%;margin-top:12px;padding:13px;border-radius:12px;background:var(--card);color:var(--blue);font-size:17px;font-weight:500}
.loadmore:active{opacity:.6}
.pcancel{color:var(--red);font-size:13px;font-weight:600;flex:none}
.folders{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.fold{background:var(--card);border-radius:12px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--label)}
.fold svg{width:26px;height:26px;fill:none;stroke:var(--fc);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fold small{font-size:11px;color:var(--label2);font-weight:400}
.fold.on{background:var(--blue);color:#fff}.fold.on small{color:rgba(255,255,255,.8)}.fold.on svg{stroke:#fff}
.fold:active{opacity:.6}
.chipbar{margin:-6px 0 12px}.chipbar button{background:var(--fill);color:var(--blue);border-radius:14px;padding:6px 12px;font-size:14px}
.gap{height:18px}
.av{flex:0 0 40px;height:40px;border-radius:50%;color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center}
.st{font-weight:600}.st.ok{color:var(--green)}.st.no{color:var(--red)}.st.wait{color:#ff9500}
.tab{position:relative}
.badge{position:absolute;top:-3px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.pick{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{flex:none;padding:7px 14px;border-radius:16px;background:var(--fill);color:var(--label);font-size:14px}
.chip.on{background:var(--blue);color:#fff}
#loading{position:absolute;inset:0;z-index:90;display:flex;align-items:center;justify-content:center}
.spin{width:44px;height:44px;border-radius:12px;background:rgba(40,40,42,.85);display:flex;align-items:center;justify-content:center}
.spin i{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(110%)}}@keyframes drop{from{transform:translateY(-40px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="phone">

<!-- AUTH -->
<div id="auth">
  <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M12 16v-5m-2 2 2-2 2 2"/></svg></div>
  <h1 id="aTitle">PrivateDrive</h1>
  <p class="sub" id="aSub">Sign in to access your private files.</p>
  <div class="seg"><button id="segIn" class="on" type="button">Sign In</button><button id="segUp" type="button">Create Account</button></div>
  <form id="authForm" novalidate>
    <div class="group">
      <input id="email" type="email" placeholder="Email" autocomplete="email" autocapitalize="none">
      <div class="pw-wrap">
        <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false">
          <svg id="pwEye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="pw-wrap">
        <input id="conf" type="password" placeholder="Confirm password" autocomplete="new-password" class="hidden">
        <button type="button" class="pw-toggle hidden" id="pwToggle2" aria-label="Show password" aria-pressed="false">
          <svg id="pwEye2" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div id="aNote" class="note"></div>
    <button class="btn" id="aBtn" type="submit">Sign In</button>
  </form>

/* Called after a successful sign-in to link the OneSignal subscription to the Supabase user ID. */
async function osLogin(userId){
  try{
    await OneSignalDeferred.push(async function(OneSignal){
      await OneSignal.login(userId);
      /* Optionally request permission immediately after login if not yet granted. */
      if(!OneSignal.Notifications.permission){
        try{await OneSignal.Notifications.requestPermission()}catch{}
      }
    });
  }catch(e){console.warn("OneSignal login failed:",e)}
}
/* Called on sign-out to unlink the subscription. */
async function osLogout(){
  try{
    await OneSignalDeferred.push(async function(OneSignal){
      await OneSignal.logout();
    });
  }catch(e){console.warn("OneSignal logout failed:",e)}
}
/* Toggle the OS-level push permission. */
async function osTogglePush(){
  return new Promise(resolve=>{
    OneSignalDeferred.push(async function(OneSignal){
      try{
        if(OneSignal.Notifications.permission){
          /* Can't programmatically revoke browser permission; guide user to settings. */
          resolve("blocked");
        }else{
          const ok=await OneSignal.Notifications.requestPermission();
          resolve(ok?"granted":"denied");
        }
      }catch(e){console.warn(e);resolve("error")}
    });
  });
}

function shareLinkSheet(){
  const ov=document.createElement("div");ov.className="ov";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");
  ov.innerHTML=`<div class="sheet full">
    <h3>Send a Link</h3>
    <p>Paste a link and share it with someone.</p>
    ${pickHtml()}
    <div class="group">
      <input id="slUrl" type="url" placeholder="https://…" autocapitalize="none" autocomplete="off" inputmode="url">
      <input id="slTitle" type="text" placeholder="Title (optional)">
      <input id="slTo" type="email" placeholder="Recipient email" autocapitalize="none" autocomplete="off">
    </div>
    <div class="note" id="slNote"></div>
    <button class="btn" id="slGo">Send Link</button>
    <button class="cancel-l" id="slNo">Cancel</button>
  </div>`;
  const close=()=>ov.remove();
  ov.onclick=e=>{if(e.target===ov)dismissTop()};
  $("phone").appendChild(ov);
  pushBack(close);
  ov.querySelector("#slNo").onclick=()=>dismissTop();

  const urlI=ov.querySelector("#slUrl"),titleI=ov.querySelector("#slTitle"),toI=ov.querySelector("#slTo"),
        noteEl=ov.querySelector("#slNote"),goBtn=ov.querySelector("#slGo");

  ov.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    toI.value=c.dataset.e;
    ov.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));
  });
  setTimeout(()=>urlI.focus(),300);

  const send=async()=>{
    const rawUrl=urlI.value.trim();
    let title=titleI.value.trim();
    const email=toI.value.trim().toLowerCase();
    if(!rawUrl)return note(noteEl,"Paste a link.");
    let url=rawUrl;
    if(!/^https?:\/\//i.test(url))url="https://"+url;
    try{new URL(url)}catch{return note(noteEl,"That doesn't look like a valid link.")}
    if(!email)return note(noteEl,"Enter the recipient's email address.");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return note(noteEl,"Enter a valid email address.");
    if(email===(user.email||"").toLowerCase())return note(noteEl,"That's your own email.");
    if(!title)title=hostOf(url);

    goBtn.disabled=true;goBtn.textContent="Sending…";
    let createdId=null;
    try{
      const row={owner_id:user.id,original_name:title,storage_path:url,mime_type:"text/uri-list",file_size:0};
      const ex=expAt(defExp);
      const ins=await sb.from("files").insert(ex?{...row,expires_at:ex}:row).select("id").single();
      if(ins.error||!ins.data)throw new Error(ins.error?ins.error.message:"Couldn't save link.");
      createdId=ins.data.id;

      const rpc=await sb.rpc("share_file",{p_file_id:createdId,p_recipient_email:email});
      if(rpc.error){await sb.from("files").delete().eq("id",createdId);throw new Error(rpc.error.message)}
      if(!rpc.data||!rpc.data.success){
        await sb.from("files").delete().eq("id",createdId);
        throw new Error((rpc.data&&rpc.data.message)||"The link could not be shared.");
      }

      toast(`Link sent to ${email}`,"success");
      dismissTop();
      refreshPeople();
      if(tab==="my")load();else if(tab==="sent")load();else if(tab==="people")renderPeople();
    }catch(e){
      console.error(e);

function triggerDownload(url,name){
  const a=document.createElement("a");
  a.href=url;a.download=name||"";a.rel="noopener";a.style.display="none";
  document.body.appendChild(a);
  a.click();

async function download(it){
  if(isLink(it.path))return openLink(it);
  try{
    busy(true);
    const{data,error}=await sb.storage.from(BUCKET).createSignedUrl(it.path,120,{download:it.name});
    busy(false);
    if(error||!data)return toast("Download failed: "+(error?error.message:"no link"),"error");
    triggerDownload(data.signedUrl,it.name);
  }catch(e){busy(false);console.error(e);toast("Download failed.","error")}
}

async function downloadMany(arr){
  if(!arr||!arr.length)return;
  const real=arr.filter(x=>!isLink(x.path));
  const links=arr.filter(x=>isLink(x.path));
  if(!real.length){links.forEach(openLink);return}
  if(real.length===1&&!links.length)return download(real[0]);

  const total=real.length;
  showProgress("download","Preparing ZIP…");

  try{
    const zip=new JSZip();
    const used={};
    let failed=0,done=0;

    for(const it of real){
      setProgress(Math.round(done/total*90),it.name,`File ${done+1} of ${total}`);
      try{
        const{data,error}=await sb.storage.from(BUCKET).download(it.path);
        if(error||!data){failed++}
        else{
          let name=it.name;
          if(used[name]){used[name]++;const dot=name.lastIndexOf(".");name=dot>0?name.slice(0,dot)+" ("+used[name]+")"+name.slice(dot):name+" ("+used[name]+")"}
          else used[name]=1;
          zip.file(name,data);
        }
      }catch(e){console.error(e);failed++}
      done++;
      setProgress(Math.round(done/total*90));
    }

    const count=Object.keys(zip.files).length;
    if(!count){
      hideProgress(0);
      return toast("Couldn't download files.","error");
    }

    setProgress(90,"Compressing…",`${count} file${count===1?"":"s"}`);
    const blob=await zip.generateAsync(
      {type:"blob",compression:"DEFLATE",compressionOptions:{level:6}},
      meta=>setProgress(90+meta.percent*0.1)
    );

    setProgress(100,"Done");
    const url=URL.createObjectURL(blob);
    const stamp=new Date().toISOString().slice(0,10);
    triggerDownload(url,`PrivateDrive-${stamp}.zip`);
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    hideProgress();

    toast(`Downloaded ${count} file${count===1?"":"s"} as ZIP${failed?` — ${failed} failed`:""}`,failed?"error":"success");
  }catch(e){
    hideProgress(0);
    console.error(e);
    toast("Couldn't create ZIP.","error");
  }
}

/* ---------- upload (parallel) ---------- */
const UPLOAD_CONCURRENCY=4;
const activeCancels=new Set();
let cancelAll=false;

$("addBtn").onclick=()=>tab==="people"?personSheet():$("fileInput").click();
$("fileInput").addEventListener("change",async e=>{const f=Array.from(e.target.files||[]);if(f.length)await uploadFiles(f);e.target.value=""});

["dragleave","drop"].forEach(n=>scr.addEventListener(n,e=>{e.preventDefault();scr.classList.remove("drag")}));

  for(const fn of [...activeCancels]){try{fn()}catch{}}
  activeCancels.clear();
};

async function uploadFiles(files){
  if(!user||!files.length)return;
  const total=files.length;
  let ok=0,failed=0,done=0;
  cancelAll=false;
  activeCancels.clear();

  showProgress("upload",`Uploading ${total} file${total===1?"":"s"}…`);
  setProgress(0,null,`0 of ${total}`);

  const perFile=new Array(total).fill(0);
  const refreshAggregate=()=>{
    let sum=0;
    for(const v of perFile)sum+=v;
    setProgress(sum/total,null,`${done} of ${total}`);
  };

  const queue=files.map((f,i)=>({f,i}));
  const workers=[];
  const workerCount=Math.min(UPLOAD_CONCURRENCY,total);

  for(let w=0;w<workerCount;w++){
    workers.push((async()=>{
      while(queue.length&&!cancelAll){
        const job=queue.shift();
        if(!job)break;
        const {f,i}=job;
        try{
          const r=await uploadOne(f,(loaded,size)=>{
            perFile[i]=size>0?Math.min(100,(loaded/size)*100):100;
            refreshAggregate();
          });
          if(r&&r.success){ok++;perFile[i]=100}
          else{
            failed++;
            if(r&&r.message&&!/cancel/i.test(r.message))toast(`${f.name}: ${r.message}`,"error");
          }
        }catch(e){
          console.error(e);
          failed++;
          if(!/cancel/i.test(String(e&&e.message||"")))toast(`Couldn't upload ${f.name}.`,"error");
        }
        done++;
        refreshAggregate();
      }
    })());
  }

  await Promise.all(workers);

  hideProgress();
  if(ok)toast(`${ok} file${ok===1?"":"s"} uploaded${failed?` — ${failed} failed`:""}`,failed?"error":"success");
  if(tab==="my")load();
}

async function uploadOne(file,onProgress){
  const path=`${user.id}/${crypto.randomUUID()}/${safeName(file.name)}`;
  const{data:sd}=await sb.auth.getSession();
  const s=sd&&sd.session;
  if(!s)return{success:false,message:"Your session expired. Sign in again."};
  try{
    await(window.tus
      ?tusUpload(file,path,onProgress)
      :xhrUpload(file,path,s.access_token,onProgress));
  }catch(e){
    console.error(e);
    return{success:false,message:e.message||"Upload failed."};
  }
  const row={owner_id:user.id,original_name:file.name,storage_path:path,mime_type:file.type||"application/octet-stream",file_size:file.size},ex=expAt(defExp);
  let{error}=await sb.from("files").insert(ex?{...row,expires_at:ex}:row);
  if(error&&ex&&/expires_at/.test(error.message)){toast("Uploaded without auto-delete: add the expires_at column.","error");({error}=await sb.from("files").insert(row))}
  if(error){console.error(error);await sb.storage.from(BUCKET).remove([path]);return{success:false,message:error.message}}
  if(ptype(file.name)==="image"){
    makeThumb(file).then(b=>{
      if(b)return sb.storage.from(BUCKET).upload(thumbPath(path),b,{contentType:"image/jpeg"});
    }).catch(()=>{});
  }
  return{success:true};
}

function xhrUpload(file,path,token,onProgress){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest(),enc=path.split("/").map(encodeURIComponent).join("/");
    x.open("POST",`${SUPABASE_URL}/storage/v1/object/${encodeURIComponent(BUCKET)}/${enc}`,true);
    x.setRequestHeader("apikey",SUPABASE_ANON_KEY);x.setRequestHeader("Authorization","Bearer "+token);
    x.setRequestHeader("x-upsert","false");x.setRequestHeader("cache-control","3600");
    x.setRequestHeader("Content-Type",file.type||"application/octet-stream");
    const cancel=()=>{try{x.abort()}catch{}};
    activeCancels.add(cancel);
    const done=()=>activeCancels.delete(cancel);
    x.upload.onprogress=e=>{if(e.lengthComputable&&onProgress)onProgress(e.loaded,e.total||file.size)};
    x.onload=()=>{
      done();
      if(x.status>=200&&x.status<300)return res();
      let m="Upload failed.";
      try{const r=JSON.parse(x.responseText);m=r.message||r.error||m}catch{if(x.responseText)m=x.responseText}
      rej(new Error(m));
    };
    x.onerror=()=>{done();rej(new Error("Network error while uploading."))};
    x.onabort=()=>{done();rej(new Error("Upload cancelled."))};
    x.ontimeout=()=>{done();rej(new Error("Upload timed out."))};
    x.send(file);
  });
}

function tusUpload(file,path,onProgress){
  return new Promise((res,rej)=>{
    let cancel=null;
    const up=new tus.Upload(file,{
      endpoint:`${SUPABASE_URL}/storage/v1/upload/resumable`,
      retryDelays:[0,3000,5000,10000,20000],
      chunkSize:6*1024*1024,
      headers:{apikey:SUPABASE_ANON_KEY,"x-upsert":"false"},
      uploadDataDuringCreation:true,
      removeFingerprintOnSuccess:true,
      metadata:{bucketName:BUCKET,objectName:path,contentType:file.type||"application/octet-stream",cacheControl:"3600"},
      onBeforeRequest:async req=>{const{data}=await sb.auth.getSession();if(data&&data.session)req.setHeader("Authorization","Bearer "+data.session.access_token)},
      onProgress:loaded=>{if(onProgress)onProgress(loaded,file.size)},
      onSuccess:()=>{if(cancel)activeCancels.delete(cancel);res()},
      onError:err=>{
        if(cancel)activeCancels.delete(cancel);
        let m=(err&&err.message)||"Upload failed.";
        try{const b=JSON.parse(err.originalResponse.getBody());m=b.message||b.error||m}catch{}
        rej(new Error(m));
      }
    });
    cancel=()=>{
      try{up.abort(true).catch(()=>{})}catch{}
      activeCancels.delete(cancel);
      rej(new Error("Upload cancelled."));
    };
    activeCancels.add(cancel);
    up.start();
  });
}

}

  if(g.moved<10){
    const n=Date.now();
    if(n-tapT<300){clearTimeout(chromeT);tapT=0;if(z.s>1){z.s=1;z.x=z.y=0}else z.s=2.5;ap()}
    else{tapT=n;chromeT=setTimeout(()=>$("pv").classList.toggle("pv-hide"),280)}
  }else if(z.s===1&&Math.abs(g.dx)>60&&Math.abs(g.dy)<70)pvGo(g.dx<0?1:-1);
},{passive:true});
stg0.addEventListener("click",e=>{if(e.target.id==="pvStage")$("pv").classList.toggle("pv-hide")});
</script>
