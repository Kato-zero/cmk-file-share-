<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PrivateDrive">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="application-name" content="PrivateDrive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>PrivateDrive</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.3.1/dist/tus.min.js" integrity="sha384-UlHjK3F7TCQCEUpnoa1ohMbP2oaWB3Aypv4gMo511vaZ86uUZ0Zv7UzZ0J1zRUT1" crossorigin="anonymous"></script>
<style>
:root{--blue:#007aff;--red:#ff3b30;--green:#34c759;--bg:#f2f2f7;--card:#fff;--label:#000;--label2:rgba(60,60,67,.6);--sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);--blur:rgba(249,249,249,.82);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--blue:#0a84ff;--red:#ff453a;--green:#30d158;--bg:#000;--card:#1c1c1e;--label:#fff;--label2:rgba(235,235,245,.6);--sep:rgba(84,84,88,.5);--fill:rgba(118,118,128,.24);--blur:rgba(22,22,24,.82)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
#phone{position:relative;height:100dvh;width:100%;overflow:hidden;background:var(--bg)}
@media(min-width:600px){body{background:#d1d1d6;display:flex;align-items:center;justify-content:center}
#phone{width:390px;height:min(844px,calc(100dvh - 40px));border-radius:48px;box-shadow:0 0 0 10px #111,0 30px 80px rgba(0,0,0,.35);--sat:44px;--sab:20px}}

/* Auth */
#auth{position:absolute;inset:0;overflow-y:auto;padding:calc(var(--sat) + 48px) 20px calc(var(--sab) + 24px);background:var(--bg);z-index:30}
.app-icon{width:76px;height:76px;border-radius:18px;background:linear-gradient(160deg,#4da3ff,#0a64d6);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 8px 22px rgba(0,122,255,.35)}
.app-icon svg{width:40px;height:40px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#auth h1{text-align:center;font-size:30px;margin:0 0 6px;letter-spacing:-.4px}
#auth .sub{text-align:center;color:var(--label2);margin:0 0 26px;font-size:15px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:18px}
.seg button{flex:1;padding:7px;border-radius:7px;font-size:13px;font-weight:600;transition:.2s}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.group input{display:block;width:100%;border:0;background:none;padding:14px 16px;font-size:17px;outline:none;border-bottom:.5px solid var(--sep)}
.group input:last-child{border-bottom:0}
.group input::placeholder{color:var(--label2)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;margin-top:20px;transition:.15s}
.btn.ghost{background:var(--fill);color:var(--blue);margin-top:12px}
.btn:active{opacity:.6;transform:scale(.98)}.btn:disabled{opacity:.4}
.note{margin:14px 6px 0;padding:12px 14px;border-radius:12px;font-size:14px;display:none}
.note.show{display:block}.note.error{background:rgba(255,59,48,.14);color:var(--red)}.note.success{background:rgba(52,199,89,.16);color:var(--green)}

/* Nav */
#nav{position:absolute;top:0;left:0;right:0;z-index:10;padding-top:var(--sat);background:transparent;transition:.2s}
#nav.solid{background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--sep)}
.nav-row{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:relative}
.nav-title{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:17px;opacity:0;transition:.2s;pointer-events:none}
#nav.solid .nav-title{opacity:1}
.nav-btn{color:var(--blue);font-size:17px;padding:8px 0;z-index:1;display:flex;align-items:center;gap:4px}
.nav-btn:active{opacity:.4}.nav-btn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* Scroll */
#scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 44px) 16px calc(var(--sab) + 110px)}
.large{font-size:34px;font-weight:700;letter-spacing:.3px;margin:2px 4px 10px}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 8px;height:36px;margin-bottom:18px}
.search svg{width:16px;height:16px;fill:none;stroke:var(--label2);stroke-width:2.2;stroke-linecap:round}
.search input{flex:1;border:0;background:none;outline:none;font-size:17px}
.search input::placeholder{color:var(--label2)}
.hdr{font-size:13px;color:var(--label2);margin:0 16px 7px;text-transform:uppercase;letter-spacing:-.1px}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left;position:relative;transition:background .1s}
.row:active{background:var(--fill)}
.row+.row::before{content:"";position:absolute;top:0;left:66px;right:0;height:.5px;background:var(--sep)}
.ico{flex:0 0 40px;height:40px;border-radius:9px;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:.2px}
.r-info{flex:1;min-width:0}
.r-name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-meta{font-size:13px;color:var(--label2);margin-top:2px}
.chev{width:8px;height:14px;stroke:var(--label2);opacity:.6;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 8px}
.empty{text-align:center;padding:70px 30px;color:var(--label2)}
.empty svg{width:64px;height:64px;fill:none;stroke:var(--label2);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.6;margin-bottom:10px}
.empty b{display:block;color:var(--label);font-size:21px;margin-bottom:4px}
.empty span{font-size:15px}
.foot{text-align:center;color:var(--label2);font-size:13px;margin-top:14px}
#scroll.drag{outline:3px dashed var(--blue);outline-offset:-8px}

/* Tab bar */
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;padding:7px 0 calc(var(--sab) + 2px);background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 -.5px 0 var(--sep)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--label2);font-size:10px;font-weight:500}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue)}.tab:active{opacity:.5}

/* Progress */
#progress{position:absolute;left:14px;right:14px;bottom:calc(var(--sab) + 70px);z-index:15;background:var(--blur);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-radius:18px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18);transition:.3s}
#progress.hidden{display:block!important;opacity:0;transform:translateY(20px);pointer-events:none}
.p-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.p-top span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:5px;border-radius:3px;background:var(--fill);margin:10px 0 7px;overflow:hidden}
.bar{height:100%;width:0;background:var(--blue);border-radius:3px;transition:width .15s linear}
.p-bot{display:flex;justify-content:space-between;font-size:12px;color:var(--label2)}

/* Sheets */
.ov{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 8px calc(var(--sab) + 8px);animation:fade .25s}
.sheet{background:var(--blur);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;margin-bottom:8px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.sheet .t{padding:14px 16px;text-align:center;font-size:13px;color:var(--label2);border-bottom:.5px solid var(--sep)}
.sheet .t b{display:block;color:var(--label);font-size:15px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet button.a{display:block;width:100%;padding:17px;font-size:20px;color:var(--blue);border-top:.5px solid var(--sep)}
.sheet .t+button.a{border-top:0}
.sheet button.a:active{background:var(--fill)}
.sheet button.a.d{color:var(--red)}
.sheet.cancel button.a{font-weight:600;background:var(--card)}
.full{border-radius:22px;background:var(--bg);padding:18px 16px 20px;margin-bottom:0}
.full h3{margin:0 0 2px;text-align:center;font-size:17px}
.full p{margin:0 0 16px;text-align:center;font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full .btn{margin-top:14px}
.full .cancel-l{display:block;margin:14px auto 0;color:var(--blue);font-size:17px}
#toasts{position:absolute;top:calc(var(--sat) + 8px);left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:rgba(40,40,42,.92);color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:500;max-width:88%;text-align:center;animation:drop .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.error{background:rgba(255,59,48,.95)}.toast.success{background:rgba(40,160,80,.95)}
.row{cursor:pointer}
.ico{position:relative;overflow:hidden}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.more{flex:0 0 34px;height:34px;border-radius:50%;color:var(--blue);display:flex;align-items:center;justify-content:center}
.more:active{background:var(--fill)}.more svg{width:22px;height:22px;fill:currentColor}
.exp{color:#ff9500}
#pv{position:absolute;inset:0;z-index:60;background:#000;color:#fff;overflow:hidden;animation:fade .2s}
#pvStage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#pvStage img{max-width:100%;max-height:100%;object-fit:contain;touch-action:none;user-select:none;-webkit-user-drag:none}
#pvStage video{width:100%;max-height:100%;background:#000}
#pvStage iframe{width:100%;border:0;background:#fff;height:calc(100% - var(--sat) - var(--sab) - 100px);margin-top:calc(var(--sat) + 44px)}
.pv-top,.pv-bot{position:absolute;left:0;right:0;z-index:2;display:flex;align-items:center;transition:opacity .2s}
.pv-top{top:0;padding-top:var(--sat);height:calc(var(--sat) + 48px);background:linear-gradient(rgba(0,0,0,.65),transparent)}
.pv-bot{bottom:0;justify-content:center;gap:28px;padding:22px 0 calc(var(--sab) + 12px);background:linear-gradient(transparent,rgba(0,0,0,.65));font-size:14px}
.pv-top button,.pv-bot button{color:#fff;font-size:17px;min-width:64px;padding:8px 14px}
.pv-bot button{font-size:34px;line-height:1;min-width:44px;padding:0 10px}
.pv-top button:active,.pv-bot button:active{opacity:.4}
.pv-top svg{width:22px;height:22px;fill:#fff;vertical-align:middle}
#pvTitle{flex:1;text-align:center;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-hide .pv-top,.pv-hide .pv-bot{opacity:0;pointer-events:none}
.aud{display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px;text-align:center;width:100%}.aud audio{width:100%}
.big{width:110px;height:110px;font-size:24px;border-radius:24px;flex:none}
.nop{text-align:center;padding:30px}.nop .btn{max-width:220px;margin:18px auto 0}
.nav-r{display:flex;gap:18px;align-items:center;z-index:1}
.chk{display:none;flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--label2);align-items:center;justify-content:center;color:#fff;transition:.12s}
.selmode .chk{display:flex}.selmode .more{display:none}
.selmode .row+.row::before{left:100px}
.row.on .chk{background:var(--blue);border-color:var(--blue)}
.row.on .chk::after{content:"\2713";font-size:13px;font-weight:700}
#selbar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;padding:8px 22px calc(var(--sab) + 10px);min-height:calc(var(--sab) + 56px);background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 -.5px 0 var(--sep)}
#selbar button{color:var(--blue);font-size:17px;font-weight:500;padding:10px 4px}
#selbar button.dng{color:var(--red);margin-left:auto}
#selbar button:disabled{opacity:.35}#selbar button:active:not(:disabled){opacity:.5}
.inst{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px;margin:0 0 16px}
.inst img{width:44px;height:44px;border-radius:10px;flex:none}
.inst div{flex:1;min-width:0;font-size:13px;color:var(--label2);line-height:1.3}
.inst b{display:block;color:var(--label);font-size:15px;margin-bottom:1px}
.pill{background:var(--blue);color:#fff;border-radius:16px;padding:6px 16px;font-weight:600;font-size:15px}
.pill:active{opacity:.6}
.inst .x{color:var(--label2);font-size:22px;line-height:1;padding:4px 4px 4px 2px}
.hdr{display:flex;justify-content:space-between;align-items:center}
#sortBtn{color:var(--blue);text-transform:none;font-size:13px;padding:2px 0}
.link{display:block;margin:16px auto 0;color:var(--blue);font-size:15px}
.loadmore{display:block;width:100%;margin-top:12px;padding:13px;border-radius:12px;background:var(--card);color:var(--blue);font-size:17px;font-weight:500}
.loadmore:active{opacity:.6}
.pcancel{color:var(--red);font-size:13px;font-weight:600;flex:none}
.folders{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.fold{background:var(--card);border-radius:12px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--label)}
.fold svg{width:26px;height:26px;fill:none;stroke:var(--fc);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fold small{font-size:11px;color:var(--label2);font-weight:400}
.fold.on{background:var(--blue);color:#fff}.fold.on small{color:rgba(255,255,255,.8)}.fold.on svg{stroke:#fff}
.fold:active{opacity:.6}
.chipbar{margin:-6px 0 12px}.chipbar button{background:var(--fill);color:var(--blue);border-radius:14px;padding:6px 12px;font-size:14px}
.gap{height:18px}
.av{flex:0 0 40px;height:40px;border-radius:50%;color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center}
.st{font-weight:600}.st.ok{color:var(--green)}.st.no{color:var(--red)}.st.wait{color:#ff9500}
.tab{position:relative}
.badge{position:absolute;top:-3px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.pick{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{flex:none;padding:7px 14px;border-radius:16px;background:var(--fill);color:var(--label);font-size:14px}
.chip.on{background:var(--blue);color:#fff}
#loading{position:absolute;inset:0;z-index:90;display:flex;align-items:center;justify-content:center}
.spin{width:44px;height:44px;border-radius:12px;background:rgba(40,40,42,.85);display:flex;align-items:center;justify-content:center}
.spin i{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(110%)}}@keyframes drop{from{transform:translateY(-40px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.planbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 14px;margin:0 0 14px;width:100%;text-align:left;font-size:14px}
.planbar b{font-weight:700}.planbar span{color:var(--label2);flex:1}.planbar i{font-style:normal;flex:none}
.planbar.warn{background:rgba(255,149,0,.16)}.planbar.warn span{color:#ff9500}
</style>
</head>
<body>
<div id="phone">

<!-- AUTH -->
<div id="auth">
  <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M12 16v-5m-2 2 2-2 2 2"/></svg></div>
  <h1 id="aTitle">PrivateDrive</h1>
  <p class="sub" id="aSub">Sign in to access your private files.</p>
  <div class="seg"><button id="segIn" class="on" type="button">Sign In</button><button id="segUp" type="button">Create Account</button></div>
  <form id="authForm" novalidate>
    <div class="group">
      <input id="email" type="email" placeholder="Email" autocomplete="email" autocapitalize="none">
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
      <input id="conf" type="password" placeholder="Confirm password" autocomplete="new-password" class="hidden">
    </div>
    <div id="aNote" class="note"></div>
    <button class="btn" id="aBtn" type="submit">Sign In</button>
  </form>
  <button class="link" id="forgot" type="button">Forgot password?</button>
  <button class="btn ghost" id="authInstall" type="button">Install App</button>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div id="nav"><div class="nav-row">
    <button class="nav-btn" id="settings">Settings</button><button class="nav-btn hidden" id="allBtn">Select All</button>
    <div class="nav-title" id="navTitle">My Files</div>
    <div class="nav-r"><button class="nav-btn" id="selBtn">Select</button><button class="nav-btn" id="addBtn" aria-label="Upload"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
  </div></div>
  <div id="scroll">
    <h1 class="large" id="title">My Files</h1>
    <button id="planBar" class="planbar hidden"></button>
    <div id="install" class="inst hidden"><img src="icons/icon-192.png" alt=""><div><b>Install PrivateDrive</b>Add it to your home screen for full-screen access.</div><button class="pill" id="instBtn">Install</button><button class="x" id="instX" aria-label="Dismiss">&times;</button></div>
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search"></label>
    <div id="folders" class="folders"></div><div id="pchip" class="chipbar hidden"><button id="pchipBtn"></button></div>
    <div class="hdr"><span id="count"></span><button id="sortBtn" aria-label="Sort order"></button></div>
    <div id="list"></div>
    <div class="foot" id="who"></div>
  </div>
  <div id="selbar" class="hidden"><button id="shBtn" disabled>Share</button><button id="delBtn" class="dng" disabled>Delete</button></div>
  <div id="progress" class="hidden">
    <div class="p-top"><span id="pName">Uploading…</span><span id="pPct" style="color:var(--blue)">0%</span><button class="pcancel" id="pCancel">Cancel</button></div>
    <div class="track"><div class="bar" id="pBar"></div></div>
    <div class="p-bot"><span id="pSize"></span><span id="pInfo"></span></div>
  </div>
  <nav id="tabbar">
    <button class="tab on" data-tab="my"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Files</button>
    <button class="tab" data-tab="shared"><svg viewBox="0 0 24 24"><path d="M4 13V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v7"/><path d="M4 13h4l1 3h6l1-3h4v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>Inbox<span class="badge hidden" id="badge"></span></button>
    <button class="tab" data-tab="sent"><svg viewBox="0 0 24 24"><path d="m21 3-9.5 18-2.5-7.5L1.5 11z"/><path d="M21 3 9 13.5"/></svg>Sent</button>

function baseQ(sel,opt){
  if(tab==="my")return sb.from("files").select(sel,opt).eq("owner_id",user.id);

function progressStart(f,i,n){$("progress").classList.remove("hidden");$("pName").textContent=f.name;$("pPct").textContent="0%";$("pBar").style.width="0%";$("pSize").textContent=`0 / ${bytes(f.size)}`;$("pInfo").textContent=n>1?`File ${i+1} of ${n}`:""}
function progressUpdate(f,i,n,loaded,t0){
  const p=f.size>0?Math.min(100,Math.round(loaded/f.size*100)):100,sp=loaded/Math.max((Date.now()-t0)/1000,.001);
  $("pPct").textContent=p+"%";$("pBar").style.width=p+"%";$("pSize").textContent=`${bytes(loaded)} / ${bytes(f.size)}`;
  $("pInfo").textContent=(n>1?`File ${i+1} of ${n} · `:"")+bytes(sp)+"/s";
}
async function uploadFiles(files){
  if(!user)return;
  let ok=0;cancelAll=false;
  for(let i=0;i<files.length&&!cancelAll;i++){
    const f=files[i];progressStart(f,i,files.length);
    try{
      const r=await uploadOne(f,i,files.length);
      if(r.success){ok++;$("pPct").textContent="100%";$("pBar").style.width="100%";$("pInfo").textContent="Done"}
      else toast(`${f.name}: ${r.message}`,"error");
    }catch(e){console.error(e);toast(`Couldn't upload ${f.name}.`,"error")}
  }
  setTimeout(()=>$("progress").classList.add("hidden"),900);
  if(ok)toast(`${ok} file${ok===1?"":"s"} uploaded`,"success");
  if(tab==="my")load();
}
async function uploadOne(file,i,n){
  const path=`${user.id}/${crypto.randomUUID()}/${safeName(file.name)}`;
  const{data:sd}=await sb.auth.getSession();
  const s=sd&&sd.session;
  if(!s)return{success:false,message:"Your session expired. Sign in again."};
  try{await(window.tus?tusUpload(file,path,i,n):xhrUpload(file,path,s.access_token,i,n))}
  catch(e){console.error(e);return{success:false,message:e.message||"Upload failed."}}
  const row={owner_id:user.id,original_name:file.name,storage_path:path,mime_type:file.type||"application/octet-stream",file_size:file.size},ex=expAt(defExp);
  let{error}=await sb.from("files").insert(ex?{...row,expires_at:ex}:row);
  if(error&&ex&&/expires_at/.test(error.message)){toast("Uploaded without auto-delete: add the expires_at column.","error");({error}=await sb.from("files").insert(row))}
  if(error){console.error(error);await sb.storage.from(BUCKET).remove([path]);return{success:false,message:error.message}}
  if(ptype(file.name)==="image"){const b=await makeThumb(file);if(b)await sb.storage.from(BUCKET).upload(thumbPath(path),b,{contentType:"image/jpeg"})}
  return{success:true};
}
function xhrUpload(file,path,token,i,n){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest(),enc=path.split("/").map(encodeURIComponent).join("/");
    x.open("POST",`${SUPABASE_URL}/storage/v1/object/${encodeURIComponent(BUCKET)}/${enc}`,true);
    x.setRequestHeader("apikey",SUPABASE_ANON_KEY);x.setRequestHeader("Authorization","Bearer "+token);
    x.setRequestHeader("x-upsert","false");x.setRequestHeader("cache-control","3600");
    x.setRequestHeader("Content-Type",file.type||"application/octet-stream");
    const t0=Date.now();curCancel=()=>x.abort();
    x.upload.onprogress=e=>{if(e.lengthComputable)progressUpdate(file,i,n,e.loaded,t0)};
    x.onload=()=>{
      if(x.status>=200&&x.status<300)return res();
      let m="Upload failed.";
      try{const r=JSON.parse(x.responseText);m=r.message||r.error||m}catch{if(x.responseText)m=x.responseText}
      rej(new Error(m));
    };
    x.onerror=()=>rej(new Error("Network error while uploading."));
    x.onabort=()=>rej(new Error("Upload cancelled."));
    x.ontimeout=()=>rej(new Error("Upload timed out."));
    x.send(file);
  });
}

let cancelAll=false,curCancel=null;
$("pCancel").onclick=()=>{cancelAll=true;if(curCancel)curCancel()};
function tusUpload(file,path,i,n){
  return new Promise((res,rej)=>{
    const t0=Date.now();
    const up=new tus.Upload(file,{
      endpoint:`${SUPABASE_URL}/storage/v1/upload/resumable`,
      retryDelays:[0,3000,5000,10000,20000],
      chunkSize:6*1024*1024,
      headers:{apikey:SUPABASE_ANON_KEY,"x-upsert":"false"},
      uploadDataDuringCreation:true,
      removeFingerprintOnSuccess:true,
      metadata:{bucketName:BUCKET,objectName:path,contentType:file.type||"application/octet-stream",cacheControl:"3600"},
      onBeforeRequest:async req=>{const{data}=await sb.auth.getSession();if(data&&data.session)req.setHeader("Authorization","Bearer "+data.session.access_token)},
      onProgress:loaded=>progressUpdate(file,i,n,loaded,t0),
      onSuccess:()=>{curCancel=null;res()},
      onError:err=>{curCancel=null;let m=(err&&err.message)||"Upload failed.";try{const b=JSON.parse(err.originalResponse.getBody());m=b.message||b.error||m}catch{}rej(new Error(m))}
    });
    curCancel=()=>{up.abort(true).catch(()=>{});curCancel=null;rej(new Error("Upload cancelled."))};
    up.start();
  });
}
async function makeThumb(file){
  try{
    const bmp=await createImageBitmap(file),k=Math.min(1,256/Math.max(bmp.width,bmp.height));
    const w=Math.max(1,Math.round(bmp.width*k)),h=Math.max(1,Math.round(bmp.height*k));
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bmp,0,0,w,h);
    if(bmp.close)bmp.close();
    return await new Promise(r=>c.toBlob(r,"image/jpeg",.75));
  }catch{return null}
}

const VAPID_PUBLIC="PASTE_YOUR_VAPID_PUBLIC_KEY";
let pushState=false;
const pushOK=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const b64u=k=>{const b=atob((k+"=".repeat((4-k.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))};
function savePush(sub){const j=sub.toJSON();return sb.from("push_subscriptions").upsert({user_id:user.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:"user_id,endpoint"})}
async function syncPush(){
  if(!pushOK()||Notification.permission!=="granted"){pushState=false;return}
  try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();pushState=!!sub;if(sub)await savePush(sub)}catch(e){console.warn(e)}

async function pushToggle(){

  if(!pushOK()||needInstall)return sheet("Notifications",needInstall?"On iPhone, add the app to your home screen first, then turn notifications on from inside it.":"This browser doesn't support push notifications.",[{l:"OK",f:()=>{}}]);
  if(VAPID_PUBLIC.startsWith("PASTE"))return toast("Push isn't set up yet: add your VAPID public key.","error");
  const perm=await Notification.requestPermission();
  if(perm!=="granted")return toast("Notifications are blocked. Allow them in your browser or phone settings.","error");
  try{
    busy(true);
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    const r=await savePush(sub);busy(false);
    if(r.error)return toast(/push_subscriptions/.test(r.error.message)?"Run setup-notifications.sql first.":r.error.message,"error");
    pushState=true;toast("Notifications on","success");
  }catch(e){busy(false);console.error(e);toast("Couldn't turn on notifications.","error")}
}

async function fnCall(name,body){
  try{
    const{data:sd}=await sb.auth.getSession();
    const t=sd&&sd.session&&sd.session.access_token;
    if(!t)return{ok:false,message:"Please sign in again."};
    const r=await fetch("/api/"+name,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify(body)});
    let j={};try{j=await r.json()}catch{}
    if(!r.ok||!j.success)return{ok:false,message:j.message||"Payment request failed."};
    return{ok:true,...j};
  }catch(e){console.error(e);return{ok:false,message:"Couldn't reach the payment service."}}
}
async function pollPayment(ref,cancelled){
  for(let i=0;i<45;i++){
    await new Promise(r=>setTimeout(r,i?4000:2500));
    if(cancelled())return"cancelled";
    const r=await fnCall("check-payment",{referenceId:ref});
    if(r.ok&&(r.status==="successful"||r.status==="failed"))return r.status;
  }
  return"timeout";
}
async function resumePayments(){

  try{
    const since=new Date(Date.now()-864e5).toISOString();
    const{data}=await sb.from("payments").select("reference").eq("status","pending").gte("created_at",since).limit(3);
    let hit=false;
    for(const p of data||[]){const r=await fnCall("check-payment",{referenceId:p.reference});if(r.ok&&r.status==="successful")hit=true}
    if(hit){await loadPlan();toast("Payment confirmed. Premium is active!","success")}
  }catch(e){console.warn(e)}
}
function paySheet(){
  const ov=document.createElement("div");ov.className="ov";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");
  const perks=(cfg.perks||"").split("|").map(x=>x.trim()).filter(Boolean);
  let saved="";try{saved=localStorage.getItem("pd_phone")||""}catch{}
  const amt=esc(cfg.currency_symbol+cfg.price);
  ov.innerHTML=`<div class="sheet full" style="max-height:90dvh;overflow-y:auto"><h3>Go Premium</h3><p style="white-space:normal;font-size:24px;font-weight:700;color:var(--label);margin:8px 0 4px">${esc(priceLabel())}</p><div style="margin:8px 4px 12px;font-size:15px">${perks.map(x=>`<div style="padding:3px 0">✓ ${esc(x)}</div>`).join("")}</div><p style="white-space:normal;text-align:left;margin:0 4px 14px">Enter your MTN, Airtel or Zamtel Money number. You'll get a prompt on your phone to approve the payment.</p><div class="group"><input id="payPhone" type="tel" inputmode="tel" placeholder="Mobile money number (0977…)" value="${esc(saved)}" autocomplete="tel"></div><div class="note" id="payNote"></div><button class="btn" id="payGo">Pay ${amt}</button><button class="cancel-l" id="payNo">Cancel</button></div>`;
  let stop=false;
  const close=()=>{stop=true;ov.remove()},n=ov.querySelector("#payNote"),go=ov.querySelector("#payGo"),ph=ov.querySelector("#payPhone");
  ov.onclick=e=>{if(e.target===ov)close()};ov.querySelector("#payNo").onclick=close;
  $("phone").appendChild(ov);
  const reset=()=>{go.disabled=false;ph.disabled=false;go.textContent="Pay "+cfg.currency_symbol+cfg.price};
  go.onclick=async()=>{
    const phone=ph.value.trim();
    if(phone.replace(/\D/g,"").length<9)return note(n,"Enter your mobile money number.");
    try{localStorage.setItem("pd_phone",phone)}catch{}
    go.disabled=true;ph.disabled=true;go.textContent="Sending request…";n.className="note";
    const c=await fnCall("create-payment",{phone});
    if(!c.ok){reset();return note(n,c.message)}
    go.textContent="Waiting for approval…";
    note(n,"Approve the prompt on your phone and enter your PIN. This screen updates by itself.","success");
    const r=await pollPayment(c.referenceId,()=>stop);
    if(stop)return;
    if(r==="successful"){close();await loadPlan();toast("Premium unlocked · "+daysTxt(),"success")}
    else if(r==="failed"){reset();note(n,"The payment wasn't completed. Please try again.")}
    else{reset();note(n,"Still waiting. If you approved it, Premium unlocks automatically within a few minutes.","success")}
  };
}
async function planSheet(){
  busy(true);await Promise.all([loadPlan(),loadConfig()]);busy(false);
  if(!planInfo)return toast("Run setup-plans.sql first.","error");
  if(planInfo.plan==="premium"){
    const u=planInfo.premium_until?` · until ${when(planInfo.premium_until)}`:"";
    return sheet("Premium",`${daysTxt()}${u}`,[{l:`Renew · ${priceLabel()}`,f:paySheet}]);
  }
  const used=planInfo.shares_used||0,lim=planInfo.shares_limit||10;
  const rs=planInfo.resets_at&&used>=lim?` · frees up ${new Intl.DateTimeFormat(undefined,{hour:"numeric",minute:"2-digit"}).format(new Date(planInfo.resets_at))}`:"";
  sheet("Free Plan",`${used} of ${lim} shares used in the last 24 hours${rs}`,[{l:`Go Premium · ${priceLabel()}`,f:paySheet}]);
}

/* ---------- reload ---------- */
async function reloadApp(){
  busy(true);
  try{
    if("serviceWorker" in navigator){const r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}
  }catch(e){console.warn(e)}
  location.reload();
}

/* ---------- sort & keyboard ---------- */
$("sortBtn").onclick=()=>sheet("Sort By","",Object.keys(SORTS).map(k=>({l:(k===sortKey?"✓ ":"")+SORTS[k],f:()=>{sortKey=k;try{localStorage.setItem("pd_sort",k)}catch{}load()}})));
$("list").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("row")){e.preventDefault();e.target.click()}});

/* ---------- auto-delete ---------- */
const K=["never","day","week","month"],DL={never:"Never",day:"After 1 day",week:"After 1 week",month:"After 1 month"},DUR={day:864e5,week:6048e5,month:2592e6};
let defExp="never";try{defExp=localStorage.getItem("pd_exp")||"never"}catch{}
if(!K.includes(defExp))defExp="never";
const expAt=k=>k==="never"?null:new Date(Date.now()+DUR[k]).toISOString();
function left(iso){
  const ms=new Date(iso)-Date.now();if(ms<=0)return"Deleting soon";
  const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5);
  return d>=1?`Deletes in ${d} day${d===1?"":"s"}`:h>=1?`Deletes in ${h} hr`:"Deletes in under 1 hr";
}
function defSheet(){sheet("Auto-Delete New Uploads","Files are removed automatically after this time.",K.map(k=>({l:(k===defExp?"✓ ":"")+DL[k],f:()=>{defExp=k;try{localStorage.setItem("pd_exp",k)}catch{}sb.auth.updateUser({data:{pd_exp:k}});toast("Auto-Delete: "+DL[k])}})))}
function expSheet(it){sheet("Auto-Delete",it.name,K.map(k=>({l:DL[k],f:()=>setExp(it,k)})))}
async function setExp(it,k){
  const v=expAt(k);busy(true);
  const{data,error}=await sb.from("files").update({expires_at:v}).eq("id",it.id).eq("owner_id",user.id).select("id");
  busy(false);
  if(error){console.error(error);return toast(/expires_at/.test(error.message)?"Add the expires_at column in Supabase first.":error.message,"error")}
  if(!data||!data.length)return toast("Couldn't update. Check the update policy on files.","error");
  it.exp=v;render();toast(k==="never"?"Auto-delete turned off":"Auto-Delete: "+DL[k],"success");
}
async function sweep(){
  if(!user)return 0;
  const{data,error}=await sb.from("files").select("id,storage_path").eq("owner_id",user.id).lt("expires_at",new Date().toISOString());
  if(error||!data||!data.length)return 0;
  let n=0;for(const f of data){const r=await purge(f.id,f.storage_path);if(!(r&&r.error))n++}
  if(n)toast(`${n} expired file${n===1?"":"s"} removed`);
  return n;
}
document.addEventListener("visibilitychange",async()=>{if(!document.hidden&&user){const n=await sweep();if(n&&tab==="my")load()}});

/* ---------- PWA ---------- */
let dip=null;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const canInstall=()=>!standalone();
function refreshInstall(){
  let x=false;try{x=localStorage.getItem("pd_inst_x")==="1"}catch{}
  $("install").classList.toggle("hidden",!canInstall()||x);
  $("authInstall").classList.toggle("hidden",!canInstall());
}
async function installApp(){
  if(dip){
    dip.prompt();const r=await dip.userChoice;dip=null;refreshInstall();
    if(r.outcome==="accepted")toast("Installing PrivateDrive…","success");
    return;
  }
  if(isIOS())sheet("Install on iPhone","Tap the Share button in Safari, choose Add to Home Screen, then tap Add.",[{l:"Got It",f:()=>{}}]);
  else sheet("Install PrivateDrive","Open your browser menu and choose Install app or Add to Home screen.",[{l:"OK",f:()=>{}}]);
}
$("instBtn").onclick=installApp;$("authInstall").onclick=installApp;
$("instX").onclick=()=>{try{localStorage.setItem("pd_inst_x","1")}catch{}refreshInstall()};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;refreshInstall()});
window.addEventListener("appinstalled",()=>{dip=null;refreshInstall();toast("PrivateDrive installed","success")});
window.addEventListener("offline",()=>toast("You're offline","error"));
window.addEventListener("online",()=>toast("Back online","success"));
refreshInstall();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)sheet("Update Available","A new version of PrivateDrive is ready.",[{l:"Reload Now",f:()=>location.reload()}])});
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(console.error));
}

/* ---------- multi-select ---------- */
let selMode=false;const selSet=new Set();
const vis=()=>items;
function setSel(on){
  selMode=on;selSet.clear();
  $("selBtn").textContent=on?"Done":"Select";
  $("settings").classList.toggle("hidden",on);$("addBtn").classList.toggle("hidden",on);$("allBtn").classList.toggle("hidden",!on);
  $("tabbar").classList.toggle("hidden",on);$("selbar").classList.toggle("hidden",!on);
  $("shBtn").classList.toggle("hidden",tab!=="my");
  $("delBtn").textContent=tab==="sent"?"Remove Access":"Delete";
  render();updateSel();
}
function updateSel(){
  const n=selSet.size,v=vis();
  const t=selMode?(n?`${n} Selected`:"Select Items"):TITLES[tab];
  $("title").textContent=$("navTitle").textContent=t;
  $("shBtn").disabled=$("delBtn").disabled=!n;
  $("allBtn").textContent=v.length&&v.every(x=>selSet.has(x.id))?"Deselect All":"Select All";
}
$("selBtn").onclick=()=>setSel(!selMode);
$("allBtn").onclick=()=>{const v=vis(),all=v.every(x=>selSet.has(x.id));v.forEach(x=>all?selSet.delete(x.id):selSet.add(x.id));render();updateSel()};
$("shBtn").onclick=()=>{const a=items.filter(x=>selSet.has(x.id));if(a.length)shareSheet(a)};
$("delBtn").onclick=()=>{
  const arr=items.filter(x=>selSet.has(x.id)),n=arr.length,sent=tab==="sent";if(!n)return;
  sheet(sent?`Remove access for ${n} share${n>1?"s":""}?`:`Delete ${n} file${n>1?"s":""}?`,sent?"Recipients will no longer see them.":"This permanently removes the files and their shares.",[{l:sent?"Remove Access":"Delete",d:1,f:async()=>{
    busy(true);let ok=0,err="";
    for(const it of arr){
      const r=sent?await sb.from("file_shares").delete().eq("id",it.id).eq("owner_id",user.id):await purge(it.id,it.path);
      if(r&&r.error)err=r.error.message;else ok++;
    }
    busy(false);setSel(false);
    toast(ok===n?(sent?"Access removed":`${n} file${n>1?"s":""} deleted`):`${ok} of ${n} done: ${err}`,ok===n?"success":"error");
    load();
  }}]);
};
$("q").addEventListener("input",()=>{if(selMode)updateSel()});

/* ---------- preview ---------- */
const PT={image:["jpg","jpeg","png","gif","webp","bmp","svg","heic","avif"],video:["mp4","mov","m4v","webm"],audio:["mp3","wav","aac","m4a","ogg"],pdf:["pdf"]};
const ptype=n=>{const e=(n.split(".").pop()||"").toLowerCase();return Object.keys(PT).find(k=>PT[k].includes(e))||""};
const urlCache={};
const fresh=p=>urlCache[p]&&Date.now()-urlCache[p].t<84e4;
async function getUrl(path){
  if(fresh(path))return urlCache[path].u;
  const{data}=await sb.storage.from(BUCKET).createSignedUrl(path,900);
  if(data&&data.signedUrl){urlCache[path]={u:data.signedUrl,t:Date.now()};return data.signedUrl}
  const d=await sb.storage.from(BUCKET).download(path);
  if(d.data){const u=URL.createObjectURL(d.data);urlCache[path]={u,t:Date.now()};return u}
  return null;
}
async function thumbs(){
  const need=items.filter(x=>ptype(x.name)==="image"&&!fresh(thumbPath(x.path))).map(x=>thumbPath(x.path));
  if(need.length){const{data}=await sb.storage.from(BUCKET).createSignedUrls(need,900);(data||[]).forEach(d=>{if(d.signedUrl&&!d.error)urlCache[d.path]={u:d.signedUrl,t:Date.now()}})}
  applyThumbs();
}
function applyThumbs(){
  document.querySelectorAll(".ico[data-p]").forEach(el=>{
    const c=urlCache[thumbPath(el.dataset.p)];
    if(c&&!el.querySelector("img")){const im=document.createElement("img");im.loading="lazy";im.alt="";im.src=c.u;im.onerror=()=>im.remove();el.appendChild(im)}
  });
}
let pvList=[],pvIdx=0,pvTok=0,z={s:1,x:0,y:0},g={},tapT=0,chromeT;
function openPv(it){
  pvList=items.filter(x=>ptype(x.name));
  pvIdx=Math.max(0,pvList.indexOf(it));
  $("pv").classList.remove("hidden","pv-hide");showPv();
}
function closePv(){$("pv").classList.add("hidden");$("pvStage").innerHTML="";pvTok++}
function pvGo(d){const n=pvIdx+d;if(n<0||n>=pvList.length)return;pvIdx=n;$("pv").classList.remove("pv-hide");showPv()}
async function showPv(){
  const it=pvList[pvIdx],t=ptype(it.name),my=++pvTok,stg=$("pvStage");
  z={s:1,x:0,y:0};
  $("pvTitle").textContent=it.name;$("pvCount").textContent=`${pvIdx+1} of ${pvList.length}`;
  document.querySelector(".pv-bot").style.display=pvList.length<2?"none":"flex";
  stg.innerHTML='<div class="spin"><i></i></div>';
  const url=await getUrl(it.path);
  if(my!==pvTok)return;
  const fail=()=>{if(my!==pvTok)return;const k=kind(it.name);stg.innerHTML=`<div class="nop"><div class="ico big" style="background:${k[1]};margin:0 auto 14px">${k[0]}</div><div>This file can't be previewed.</div><button class="btn" id="pvDl">Download</button></div>`;$("pvDl").onclick=()=>download(it)};
  if(!url)return fail();
  const u=esc(url);
  stg.innerHTML=t==="image"?`<img id="pvImg" src="${u}" draggable="false" alt="">`:t==="video"?`<video src="${u}" controls playsinline autoplay></video>`:t==="audio"?`<div class="aud"><div class="ico big" style="background:#ff2d55">AUD</div><div>${esc(it.name)}</div><audio src="${u}" controls autoplay></audio></div>`:`<iframe src="${u}"></iframe>`;
  const m=stg.querySelector("img,video,audio");if(m)m.onerror=fail;
}
$("pvDone").onclick=closePv;
$("pvMore").onclick=()=>actions(pvList[pvIdx]);
$("pvPrev").onclick=()=>pvGo(-1);$("pvNext").onclick=()=>pvGo(1);
document.addEventListener("keydown",e=>{if($("pv").classList.contains("hidden"))return;if(e.key==="Escape")closePv();if(e.key==="ArrowLeft")pvGo(-1);if(e.key==="ArrowRight")pvGo(1)});
function ap(){const im=$("pvImg");if(im)im.style.transform=`translate(${z.x}px,${z.y}px) scale(${z.s})`}
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
const stg0=$("pvStage");
stg0.addEventListener("touchstart",e=>{
  if(!$("pvImg"))return;const t=e.touches;
  if(t.length===2){g.d=dist(t);g.s=z.s;g.two=1}
  else{g.x=t[0].clientX;g.y=t[0].clientY;g.zx=z.x;g.zy=z.y;g.moved=0;g.dx=g.dy=0;g.two=0}
},{passive:true});
stg0.addEventListener("touchmove",e=>{
  if(!$("pvImg"))return;const t=e.touches;
  if(t.length===2&&g.d){z.s=Math.min(5,Math.max(1,g.s*dist(t)/g.d));g.two=1;ap()}
  else if(t.length===1&&!g.two){g.dx=t[0].clientX-g.x;g.dy=t[0].clientY-g.y;g.moved=Math.max(g.moved,Math.hypot(g.dx,g.dy));if(z.s>1){z.x=g.zx+g.dx;z.y=g.zy+g.dy;ap()}}
},{passive:true});
stg0.addEventListener("touchend",e=>{
  if(!$("pvImg")||e.touches.length)return;
  if(g.two){if(z.s<1.05){z.s=1;z.x=z.y=0}ap();g.two=0;g.d=0;return}
  if(g.moved<10){
    const n=Date.now();
    if(n-tapT<300){clearTimeout(chromeT);tapT=0;if(z.s>1){z.s=1;z.x=z.y=0}else z.s=2.5;ap()}
    else{tapT=n;chromeT=setTimeout(()=>$("pv").classList.toggle("pv-hide"),280)}
  }else if(z.s===1&&Math.abs(g.dx)>60&&Math.abs(g.dy)<70)pvGo(g.dx<0?1:-1);
},{passive:true});
stg0.addEventListener("click",e=>{if(e.target.id==="pvStage")$("pv").classList.toggle("pv-hide")});
</script>
